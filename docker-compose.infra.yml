# Chỉ hạ tầng. FE, BE và AGENT chạy native trên host.
#
# Không có gì ở đây bind-mount repo, nên phần dịch filesystem từ NTFS sang
# container -- thứ sẽ làm chậm I/O trên source -- không bao giờ phải vào việc.

services:
  redis:
    image: redis:7-alpine
    container_name: aiafa-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: aiafa-postgres
    environment:
      POSTGRES_USER: aiafa
      POSTGRES_PASSWORD: aiafa
      POSTGRES_DB: aiafa
    ports:
      - "5432:5432"
    volumes:
      - aiafa-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiafa"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Byte của tài liệu giáo viên. Chúng từng nằm trong một cột LargeBinary của
  # Postgres; chúng rời đi vì services/document -- service đọc tệp -- không có
  # credential database, nên nó không với tới được một cột.
  #
  # MINIO_ROOT_USER/PASSWORD là tên do image quy định, không đổi được, nên chúng
  # không khớp tên biến trong .env.example (MINIO_ACCESS_KEY/MINIO_SECRET_KEY).
  # Hai bên phải khớp **giá trị** bằng tay, y như POSTGRES_PASSWORD với
  # DATABASE_URL đang khớp bằng tay ở trên.
  minio:
    # chainguard/minio chứ không phải minio/minio: ảnh chính chủ đã rời Docker Hub
    # và quay.io của họ nay đòi đăng nhập, nên `docker pull minio/minio` trả về
    # "repository does not exist" trên một máy sạch. Ảnh này vẫn là MinIO, cùng
    # binary và cùng cờ dòng lệnh; nó chạy bằng uid 65532 nên volume phải thuộc về
    # uid ấy.
    image: chainguard/minio:latest
    container_name: aiafa-minio
    command: ["server", "/data", "--console-address", ":9001"]
    user: "65532:65532"
    environment:
      MINIO_ROOT_USER: aiafa
      MINIO_ROOT_PASSWORD: aiafa-local-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - aiafa-miniodata:/data

  # Kho nội dung: bản thô đọc ra từ mọi tài liệu (plan 3b). Không thay Postgres --
  # trạng thái một tài liệu vẫn chỉ ở Postgres -- mà đứng cạnh MinIO: MinIO giữ byte
  # của tệp, Mongo giữ thứ đọc được từ byte ấy. Local không bật xác thực, y như
  # Redis; lên máy thật thì bật và đưa khoá vào MONGO_URL.
  mongo:
    image: mongo:7
    container_name: aiafa-mongo
    ports:
      - "27017:27017"
    volumes:
      - aiafa-mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Ba giao diện xem dữ liệu, mỗi kho một cái, để soi từng bước của luồng tài liệu mà không
  # gõ lệnh. Không cái nào hỏi mật khẩu, nên cả ba chỉ bind 127.0.0.1: máy khác trong mạng
  # LAN không với tới được. Chỉ dùng ở local -- đừng mang lên máy thật.
  pgweb:
    image: sosedoff/pgweb:0.16.2
    container_name: aiafa-pgweb
    # Nối thẳng bằng URL nên mở trang là thấy bảng, không qua màn đăng nhập. Giá trị phải
    # khớp bằng tay với POSTGRES_* ở trên, y như DATABASE_URL.
    command: ["pgweb", "--bind=0.0.0.0", "--listen=8081",
              "--url=postgres://aiafa:aiafa@postgres:5432/aiafa?sslmode=disable"]
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: aiafa-redis-commander
    environment:
      REDIS_HOSTS: "local:redis:6379:0"
    ports:
      - "127.0.0.1:8082:8081"
    depends_on:
      redis:
        condition: service_healthy

  mongo-express:
    image: mongo-express:1.0.2
    container_name: aiafa-mongo-express
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      # Mặc định của image bật basic auth với admin/pass; tắt đi cho khớp với Mongo local,
      # vốn cũng không bật xác thực.
      ME_CONFIG_BASICAUTH: "false"
    ports:
      - "127.0.0.1:8083:8081"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  aiafa-pgdata:
  aiafa-miniodata:
  aiafa-mongodata:
