# Cấu hình ở gốc repo, chỉ dành cho tooling của Python.
#
# File này cố ý không khai bảng [project]: gốc repo không phải một package phát
# hành được. Dependency lúc chạy thuộc về pyproject.toml của từng service, để cái
# ranh giới đã khai còn đúng ngay cả khi BE và AGENT hiện đang dùng chung một
# conda environment.

[tool.ruff]
line-length = 100
target-version = "py312"
src = [
    "packages/contracts/src",
    "packages/schema/src",
    "services/be/src",
    "services/agent/src",
    "services/document/src",
    "services/ingest/src",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI khai dependency bằng giá trị mặc định của tham số; đó là cách duy nhất
# framework này diễn đạt chúng, nên nếu không có dòng dưới thì B008 sẽ nổ ở mọi
# route.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]

[tool.pytest.ini_options]
# Mode importlib giữ cho các test module trùng tên ở những service khác nhau khỏi
# đụng nhau, việc mà mode prepend mặc định không làm được nếu không có file
# __init__.py.
addopts = "-q --import-mode=importlib"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = [
    "packages/contracts/tests",
    "packages/schema/tests",
    "services/be/tests",
    "services/agent/tests",
    "services/document/tests",
    "services/ingest/tests",
]

# ---------------------------------------------------------------------------
# Thi hành ranh giới giữa các service.
#
# Ba service dùng chung một conda environment, nên không gì chặn một lần import
# chéo lúc chạy. Mấy contract này là cơ chế duy nhất giữ cho ranh giới còn sống,
# nên chúng chạy từ một hook của pre-commit thay vì chạy khi nhớ ra.
# ---------------------------------------------------------------------------

[tool.importlinter]
root_packages = ["be", "agent", "contracts", "document", "ingest", "schema"]

[[tool.importlinter.contracts]]
# Bốn service, một hợp đồng. "independence" cấm mọi chiều giữa mọi cặp, nên thêm
# một service vào danh sách này canh được mọi chiều mới mà không phải viết hợp
# đồng nào nữa.
#
# `ingest` ở đây là cổng chính của plan 2c, và nó thay cho một danh sách module
# nghiệp vụ mà `be` không được cho worker chạm: không có danh sách nào thì không
# có danh sách nào lỗi thời được. Hai service dùng chung `schema` và `contracts`,
# không dùng chung một dòng code nghiệp vụ nào.
name = "BE, AGENT, DOCUMENT and INGEST never import each other"
type = "independence"
modules = ["be", "agent", "document", "ingest"]

[[tool.importlinter.contracts]]
name = "contracts never depends on a service"
type = "forbidden"
source_modules = ["contracts"]
forbidden_modules = ["be", "agent", "document", "ingest"]

[[tool.importlinter.contracts]]
# `schema` khai bang cho hai service cung ghi vao chung. No duoc noi tu vung cua
# `contracts`, va khong duoc biet mot service nao ton tai -- mot package dung
# chung ma import nguoc vao mot nguoi dung cua no thi hai nguoi dung con lai keo
# theo ca service kia.
name = "schema never depends on a service"
type = "forbidden"
source_modules = ["schema"]
forbidden_modules = ["be", "agent", "document", "ingest"]
