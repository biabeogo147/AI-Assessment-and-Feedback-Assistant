# BE và AGENT dùng chung một conda environment, nên không gì chặn một lần import
# chéo lúc chạy. import-linter là cơ chế ranh giới duy nhất còn lại, nên nó chạy ở
# đây thay vì chạy khi nhớ ra.
#
# Ba lựa chọn có chủ ý:
#
# 1. `repo: local` cùng với `language: system`. Kéo về một repo hook thì pre-commit
#    sẽ dựng một virtualenv tách biệt, nơi be, agent và contracts đều chưa được
#    cài. Lúc đó grimp không dựng nổi import graph và hook sẽ đỏ ở mọi lần commit
#    vì một lý do không đúng.
#
# 2. Đường dẫn interpreter tuyệt đối. `python` trơ thì phân giải qua PATH, mà PATH
#    khác nhau giữa một terminal đã activate, phần tích hợp Git của PyCharm và một
#    shell trơ -- trên máy này python trong PATH là một stub của Microsoft Store.
#    Nếu conda environment dời chỗ, hãy sửa ba dòng entry bên dưới.
#
# 3. Dấu gạch chéo xuôi. pre-commit tách `entry` bằng shlex, mà shlex coi dấu gạch
#    chéo ngược là ký tự escape rồi âm thầm làm một đường dẫn Windows xẹp xuống
#    thành một đường dẫn không dùng được.

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: D:/Anaconda/envs/AI-Assessment-and-Feedback-Assistant/python.exe -m ruff format
        language: system
        types_or: [python, pyi]

      - id: ruff-check
        name: ruff check
        entry: D:/Anaconda/envs/AI-Assessment-and-Feedback-Assistant/python.exe -m ruff check --fix
        language: system
        types_or: [python, pyi]

      # Phải là console script. `python -m importlinter.cli` thoát ra 0 mà không
      # kiểm gì cả, còn `python -m importlinter` thì chết thẳng -- package không có
      # __main__. Cái thứ nhất là một lần xanh âm thầm, nên nó sẽ vô hiệu hoá đúng
      # cái check ranh giới duy nhất của repo.
      #
      # Và phải đi qua `cmd /c` để đặt `PYTHONIOENCODING`. pre-commit nối stdout vào
      # một pipe; `rich` thấy thế thì rơi về bộ render Windows cũ và encode bằng
      # cp1252, rồi chết vì cái emoji trong chuỗi "Building graph...". Nó chết ở chỗ
      # IN RA, không phải ở chỗ kiểm -- nên hook đỏ trong khi hai contract vẫn KEPT,
      # và câu lỗi thật thì bị chính exception encode ấy nuốt mất. `dev.ps1 check`
      # cũng gặp — đã đo ngày 06/10/2026 và vá cùng kiểu ở đó. Dòng này từng nói
      # `dev.ps1` miễn nhiễm "vì ở đó console nói UTF-8 được", và điều ấy chỉ đúng khi
      # chạy trong console thật; hễ output bị nối vào pipe là `rich` rơi về bộ render cũ
      # y như ở đây. Một lời miễn trừ đúng trong một nửa số cách gọi là một lời sai.
      - id: lint-imports
        name: service boundary (import-linter)
        entry: cmd /c "set PYTHONIOENCODING=utf-8&& D:/Anaconda/envs/AI-Assessment-and-Feedback-Assistant/Scripts/lint-imports.exe --config pyproject.toml"
        language: system
        pass_filenames: false
        always_run: true
