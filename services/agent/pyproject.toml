[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiafa-agent"
version = "0.1.0"
description = "Worker that grades submissions and reports evidence. Makes no routing decisions."
requires-python = ">=3.12"
dependencies = [
    "aiafa-contracts",
    "arq>=0.26",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]
