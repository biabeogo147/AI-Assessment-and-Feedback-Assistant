[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiafa-agent"
version = "0.1.0"
description = "Worker that grades submissions and reports evidence. Makes no routing decisions."
requires-python = ">=3.12"
dependencies = [
    "aiafa-contracts",
    "arq>=0.26",
    "pydantic-settings>=2.3",
    # The provider packages are pulled in by extras rather than named directly:
    # agent/llm.py builds a model from a provider string, and naming the classes
    # here would be the second place that has to change to add a provider.
    "langchain[openai,google-genai]>=1.0",
    "langgraph>=1.0",
    # Jev chọn skill cho Kriky (plan 4a). Ghim đúng bản document agent dùng: hai service cùng một
    # SDK thì cùng một phiên bản.
    "typesafe-sdk==0.7.4",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]

# Skill là file Markdown nằm cạnh code (`agent/skills/*.md`), nên chúng phải đi theo gói.
[tool.setuptools.package-data]
agent = ["skills/*.md"]
