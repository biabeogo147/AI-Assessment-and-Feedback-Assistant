[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiafa-be"
version = "0.1.0"
description = "Business layer and the only service the frontend talks to."
requires-python = ">=3.12"
dependencies = [
    "aiafa-contracts",
    # Khai báo bảng và ba câu lệnh schema. Ở một package riêng vì `services/ingest`
    # cũng ghi vào chính database này, và một định nghĩa schema sống trong một
    # service thì service kia không với tới được.
    "aiafa-schema",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "arq>=0.26",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    # Object storage cho byte tài liệu. Ở `dependencies` chứ không ở `[test]`:
    # `be/storage.py` import nó ở top-level, và cả `be.main` lẫn test tài liệu đều
    # kéo module ấy vào -- kể cả khi test chỉ chạy trên bản in-memory.
    "minio>=7.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[tool.setuptools.packages.find]
where = ["src"]
