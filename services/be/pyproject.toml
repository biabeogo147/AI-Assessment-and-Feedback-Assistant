[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiafa-be"
version = "0.1.0"
description = "Business layer and the only service the frontend talks to."
requires-python = ">=3.12"
dependencies = [
    "aiafa-contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "arq>=0.26",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]
